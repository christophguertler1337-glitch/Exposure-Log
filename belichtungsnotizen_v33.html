<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Exposure Log</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Exposure Log">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0a0a'/%3E%3Ccircle cx='50' cy='50' r='32' fill='none' stroke='%23ffffff' stroke-width='7'/%3E%3Ccircle cx='50' cy='50' r='11' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0a0a'/%3E%3Ccircle cx='50' cy='50' r='32' fill='none' stroke='%23ffffff' stroke-width='7'/%3E%3Ccircle cx='50' cy='50' r='11' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #f5f5f5;
    --paper: #0a0a0a;
    --surface: #161616;
    --field: #1e1e1e;
    --line: #2c2c2c;
    --line-strong: #f5f5f5;
    --accent: #f5f5f5;
    --muted: #8f8f8f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 20px 16px 40px;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }
  h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 20px 0;
  }
  .head {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 18px;
  }
  .head label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
  }
  .head input, .head select {
    width: 100%;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    padding: 12px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: var(--field);
    color: var(--ink);
    appearance: none;
    -webkit-appearance: none;
  }
  .head input:focus, .head select:focus { border-color: var(--ink); outline: none; }
  #rollAndBtn { grid-column: 1 / -1; display: flex; gap: 8px; align-items: flex-end; }
  #rollAndBtn > div { flex: 1; }
  button#buildBtn {
    background: var(--accent);
    color: #0a0a0a;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    padding: 12px 16px;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
  }
  #tableWrap { }
  .frame-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .frame-card.open { border-color: var(--accent); }
  .frame-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    cursor: pointer;
    background: transparent;
  }
  .frame-card.open .frame-header {
    background: var(--field);
    color: var(--ink);
  }
  .frame-header .frame-num {
    font-weight: 800;
    font-size: 16px;
    width: 28px;
  }
  .frame-header .frame-summary {
    flex: 1;
    font-size: 13px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted);
  }
  .frame-card.open .frame-header .frame-summary { color: var(--muted); }
  .frame-header .frame-summary.unedited-tag { opacity: 0.55; }
  .frame-header .chevron {
    font-size: 14px;
    color: var(--muted);
    transition: transform 0.15s;
  }
  .frame-card.open .frame-header .chevron { transform: rotate(180deg); color: var(--accent); }
  .frame-body {
    display: none;
    padding: 16px;
    border-top: 1px solid var(--line);
  }
  .frame-card.open .frame-body { display: block; }
  .field-group { margin-bottom: 14px; }
  .field-group:last-child { margin-bottom: 0; }
  .field-group label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
  }
  .field-group input[type="text"] {
    width: 100%;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    padding: 12px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: var(--field);
    color: var(--ink);
  }
  .field-group input[type="text"]:focus { border-color: var(--ink); outline: none; }
  .settings-row { display: flex; gap: 10px; }
  .settings-row .field-group { flex: 1; margin-bottom: 14px; }
  .contrast-group { display: flex; gap: 10px; flex-wrap: wrap; }
  .contrast-group label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    padding: 9px 12px;
    border: 1.5px solid var(--line);
    border-radius: 20px;
    background: var(--field);
  }
  .contrast-group input[type="checkbox"], .contrast-group input[type="radio"] {
    width: 16px; height: 16px; accent-color: var(--accent);
  }
  .contrast-group label:has(input:checked) {
    background: var(--accent);
    border-color: var(--accent);
    color: #0a0a0a;
  }
  .contrast-group.stack { flex-direction: column; align-items: stretch; }
  .contrast-group.stack label { justify-content: flex-start; }
  .contrast-group label:has(input[type="radio"]) { transition: opacity 0.15s; }
  .contrast-group:has(input[type="radio"]:checked) label:not(:has(input:checked)) { opacity: 0.35; }
  .photo-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .photo-row label.photo-btn {
    display: inline-block;
    background: var(--field);
    color: var(--ink);
    font-size: 13px;
    font-weight: 700;
    padding: 11px 16px;
    cursor: pointer;
    border: 1.5px solid var(--line);
    border-radius: 10px;
  }
  .photo-row input[type="file"] { display: none; }
  .photo-preview-wrap { display: flex; align-items: center; gap: 8px; }
  .photo-thumb-wrap {
    position: relative;
    width: 44px;
    height: 44px;
    cursor: pointer;
  }
  .photo-thumb-wrap img {
    width: 44px;
    height: 44px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--line);
    display: block;
  }
  .thumb-dots { position: absolute; inset: 0; pointer-events: none; }
  .thumb-dots .dot {
    position: absolute;
    width: 8px;
    height: 8px;
    margin-left: -4px;
    margin-top: -4px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid #000;
  }
  .photo-remove-btn {
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .marker-box {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    width: 100%;
    max-width: 420px;
  }
  .marker-img-wrap {
    position: relative;
    width: 100%;
    line-height: 0;
    margin: 12px 0;
    touch-action: none;
    overflow: hidden;
    border-radius: 10px;
  }
  .marker-img-wrap img { width: 100%; border-radius: 10px; display: block; transform-origin: center center; }
  .marker-stage {
    position: relative;
    width: 100%;
    line-height: 0;
    will-change: transform;
  }
  .marker-dot {
    position: absolute;
    width: 26px;
    height: 26px;
    margin-left: -13px;
    margin-top: -13px;
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    border: 2px solid #000;
    color: #000;
    font-size: 13px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .marker-hint { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .loc-row { display: flex; align-items: center; gap: 10px; }
  .loc-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
  .geo { font-size: 13px; font-weight: 600; color: var(--muted); line-height: 1.4; }
  .geo a { color: var(--ink); text-decoration: underline; }
  .geo.pending { color: var(--accent); font-weight: 700; }
  .geo.error { color: var(--ink); font-weight: 700; }
  .picker-overlay {
    position: fixed;
    background: #202020;
    color: #f5f5f5;
    overflow-y: auto;
    z-index: 9999;
    border-radius: 14px;
    border: 1px solid #333;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  }
  .picker-item {
    padding: 14px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .picker-item:first-child { border-radius: 14px 14px 0 0; }
  .picker-item:last-child { border-radius: 0 0 14px 14px; border-bottom: none; }
  .picker-item.picker-current {
    background: var(--accent);
    color: #0a0a0a;
    font-weight: 800;
  }
  .picker-field-row { display: flex; gap: 8px; align-items: stretch; }
  .picker-field-row input { flex: 1; }
  .edit-btn {
    flex-shrink: 0;
    width: 46px;
    font-size: 12px;
    font-weight: 600;
    background: transparent;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    color: var(--ink);
    opacity: 0.8;
  }
  #exportBtn {
    margin-top: 18px;
    background: transparent;
    border: 1.5px solid var(--ink);
    color: var(--ink);
    border-radius: 10px;
    font-weight: 700;
    padding: 12px 18px;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
    width: 100%;
  }
  #empty { text-align:center; color: var(--muted); font-weight: 500; padding: 24px; font-size: 14px; }
  .draft-file-row { display: flex; gap: 8px; margin-top: 10px; }
  .draft-file-btn {
    flex: 1;
    text-align: center;
    background: var(--field);
    border: 1.5px solid var(--line);
    color: var(--ink);
    border-radius: 10px;
    font-weight: 700;
    padding: 11px 12px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    display: block;
  }
  .draft-hint { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 10px 0 0; }
  .section-title {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 28px 0 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .storage-status { font-size: 10px; font-weight: 600; text-transform: none; letter-spacing: normal; color: var(--muted); }
  .archive-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 8px;
  }
  .archive-title { font-size: 15px; font-weight: 700; }
  .archive-info { min-width: 0; }
  .archive-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .archive-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .archive-actions button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    background: var(--field);
    color: var(--ink);
    cursor: pointer;
  }
  .archive-actions button.danger { border-color: var(--muted); color: var(--muted); }
  .summary-box {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .summary-chip {
    flex: 1;
    min-width: 90px;
    text-align: center;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 8px;
  }
  .summary-chip .num { font-size: 22px; font-weight: 800; display: block; }
  .summary-chip .lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-top: 2px; display: block; }
  #summaryEmpty { color: var(--muted); font-size: 14px; text-align: center; width: 100%; }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    padding: 20px;
  }
  .modal-box {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 340px;
  }
  .modal-title { font-size: 17px; font-weight: 800; margin-bottom: 16px; }
  .bar-row { margin-bottom: 12px; }
  .bar-row:last-of-type { margin-bottom: 0; }
  .bar-label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; margin-bottom: 5px; color: var(--ink); }
  .bar-label span:last-child { color: var(--muted); font-weight: 600; }
  .bar-track { background: var(--field); border-radius: 6px; height: 7px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--ink); border-radius: 6px; transition: width 0.3s ease; }
  .suggestion-box {
    margin-top: 16px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--field);
    font-size: 13px;
    line-height: 1.45;
    color: var(--ink);
  }
  .suggestion-label {
    display: block;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .modal-close {
    margin-top: 16px;
    width: 100%;
    background: var(--accent);
    color: #0a0a0a;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    padding: 12px;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>Exposure Log</h1>

<div class="head">
  <div>
    <label>Film</label>
    <select id="film" onchange="toggleOtherFilm(); suggestProcessing()">
      <option value="Cinestill 800T">Cinestill 800T</option>
      <option value="Cinestill BWXX">Cinestill BWXX</option>
      <option value="Kodak Gold 200">Kodak Gold 200</option>
      <option value="Kodak Portra 400">Kodak Portra 400</option>
      <option value="Ilford HP5+">Ilford HP5+</option>
      <option value="Other">Other...</option>
    </select>
    <input id="filmOther" type="text" placeholder="Enter film name" autocomplete="new-password" autocorrect="off" spellcheck="false" style="display:none; margin-top:4px;">
  </div>
  <div>
    <label>Format</label>
    <select id="format" onchange="handleFormatChange()">
      <option value="120mm">120mm</option>
      <option value="35mm">35mm</option>
    </select>
  </div>
  <div>
    <label>ISO / EI</label>
    <input id="iso" type="text" value="800" placeholder="e.g. 800" autocomplete="new-password" autocorrect="off" spellcheck="false" oninput="suggestProcessing()">
  </div>
  <div>
    <label>Processing</label>
    <select id="processing">
      <option value="Normal">Normal</option>
      <option value="Push +1">Push +1 (N+1)</option>
      <option value="Push +2">Push +2 (N+2)</option>
      <option value="Pull -1">Pull -1 (N-1)</option>
      <option value="Pull -2">Pull -2 (N-2)</option>
    </select>
  </div>
  <div id="rollAndBtn">
    <div>
      <label>Roll No.</label>
      <input id="roll" type="text" autocomplete="new-password" autocorrect="off" spellcheck="false">
    </div>
    <div>
      <label>Frames</label>
      <select id="frames">
        <option selected>10</option>
        <option>12</option>
        <option>16</option>
        <option>24</option>
        <option>36</option>
      </select>
    </div>
    <button id="buildBtn" onclick="handleBuildClick()">Build Table</button>
  </div>
</div>

<div id="tableWrap">
  <div id="empty">Choose frames and tap "Build Table".</div>
</div>

<button id="exportBtn" onclick="exportRoll()">Export Roll (.zip)</button>

<div class="draft-file-row">
  <button type="button" class="draft-file-btn" onclick="saveDraftToFile()">Save Draft (.json)</button>
  <label class="draft-file-btn" for="loadDraftInput">Load Draft</label>
  <input type="file" id="loadDraftInput" accept="application/json,.json" style="display:none" onchange="loadDraftFromFile(this)">
</div>


<div class="section-title">Archive <span id="storageStatus" class="storage-status"></span></div>
<div id="archiveList"></div>



<script>
const geoData = {}; // frame number -> {lat, lon, time}
const photoData = {}; // frame number -> dataURL
const markerData = {}; // frame number -> [{x,y}, ...] relative 0-1 coords, max 3

// Absteigend/aufsteigend fest sortierte Werte für den eigenen Picker
const SHUTTER_VALUES = ["1/2000","1/1000","1/500","1/250","1/125","1/60","1/30","1/15","1/8"];
const APERTURE_VALUES = ["f/32","f/22","f/16","f/11","f/8","f/5.6","f/4","f/2.8","f/2","f/1.4"];
const ISO_VALUES = ["3200","1600","800","400","200","100","50"];
const METER_VALUES = ["Sekonic","Camera meter","Other meter"];

function enableManualEntry(btn, event) {
  event.stopPropagation();
  const input = btn.previousElementSibling;
  input.removeAttribute('inputmode');
  closePicker();
  input.focus();
}

function closePicker() {
  const existing = document.getElementById('activePicker');
  if (existing) existing.remove();
}

function openPicker(el, values, event) {
  if (event) event.stopPropagation();
  closePicker();
  const overlay = document.createElement('div');
  overlay.className = 'picker-overlay';
  overlay.id = 'activePicker';

  values.forEach(v => {
    const item = document.createElement('div');
    item.className = 'picker-item';
    item.textContent = v;
    if (v === el.value) item.classList.add('picker-current');
    item.onclick = (e) => { e.stopPropagation(); selectPickerValue(el, v); };
    overlay.appendChild(item);
  });

  document.body.appendChild(overlay);
  const rect = el.getBoundingClientRect();
  const maxH = 260;
  overlay.style.left = rect.left + 'px';
  overlay.style.width = rect.width + 'px';
  overlay.style.maxHeight = maxH + 'px';
  const spaceBelow = window.innerHeight - rect.bottom;
  if (spaceBelow < maxH && rect.top > maxH) {
    overlay.style.top = (rect.top - Math.min(maxH, rect.top - 8)) + 'px';
  } else {
    overlay.style.top = (rect.bottom + 4) + 'px';
  }

  const currentEl = overlay.querySelector('.picker-current');
  if (currentEl) {
    currentEl.scrollIntoView({ block: 'center' });
  }
}

function selectPickerValue(el, value) {
  el.value = value;
  el.dispatchEvent(new Event('input', { bubbles: true }));
  el.dispatchEvent(new Event('change', { bubbles: true }));
  closePicker();
}

document.addEventListener('click', (e) => {
  const overlay = document.getElementById('activePicker');
  if (!overlay) return;
  if (!overlay.contains(e.target)) closePicker();
});

function toggleSekonicSub(i, show) {
  const sub = document.getElementById('sekonicSub' + i);
  sub.style.display = show ? 'flex' : 'none';
  if (!show) {
    sub.querySelectorAll('input[type=radio]').forEach(r => r.checked = false);
  }
}

function propagateField(field, rowNum, value) {
  const nextInput = document.querySelector(`input[data-field="${field}"][data-row="${rowNum + 1}"]`);
  if (nextInput && !nextInput.dataset.touched) {
    nextInput.value = value;
  }
}

function handlePhoto(input, i) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    photoData[i] = e.target.result;
    markerData[i] = [];
    const img = document.getElementById('photoPreview' + i);
    img.src = e.target.result;
    document.getElementById('photoWrap' + i).style.display = 'flex';
    renderThumbDots(i);
    updateSummary(i);
  };
  reader.readAsDataURL(file);
}

function removePhoto(i) {
  delete photoData[i];
  delete markerData[i];
  const wrap = document.getElementById('photoWrap' + i);
  const img = document.getElementById('photoPreview' + i);
  img.src = '';
  wrap.style.display = 'none';
  document.getElementById('cameraInput' + i).value = '';
  document.getElementById('galleryInput' + i).value = '';
  renderThumbDots(i);
  updateSummary(i);
}

function renderThumbDots(i) {
  const container = document.getElementById('thumbDots' + i);
  if (!container) return;
  container.innerHTML = '';
  (markerData[i] || []).forEach(m => {
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.left = (m.x * 100) + '%';
    dot.style.top = (m.y * 100) + '%';
    container.appendChild(dot);
  });
}

let markerView = { scale: 1, tx: 0, ty: 0 };
let pinchState = null;
let panState = null;
let didPan = false;

function openPhotoMarker(i) {
  if (!photoData[i]) return;
  if (!markerData[i]) markerData[i] = [];
  markerView = { scale: 1, tx: 0, ty: 0 };
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'markerModal';
  overlay.innerHTML = `
    <div class="marker-box">
      <div class="modal-title">Mark spot points (tap up to 3)</div>
      <div class="marker-img-wrap" id="markerImgWrap">

          <img id="markerImg" src="${photoData[i]}">
        </div>
      </div>
      <button type="button" class="modal-close" onclick="closeMarkerModal(${i})">Done</button>
    </div>`;
  document.body.appendChild(overlay);

  const wrap = document.getElementById('markerImgWrap');
  wrap.addEventListener('click', (e) => handleMarkerTap(e, i));
  wrap.addEventListener('touchstart', (e) => handleTouchStart(e), { passive: false });
  wrap.addEventListener('touchmove', (e) => handleTouchMove(e), { passive: false });
  wrap.addEventListener('touchend', (e) => handleTouchEnd(e));
  renderMarkerDots(i);
}

function applyMarkerTransform() {
  const stage = document.getElementById('markerStage');
  if (stage) stage.style.transform = `translate(${markerView.tx}px, ${markerView.ty}px) scale(${markerView.scale})`;
  document.querySelectorAll('#markerStage .marker-dot').forEach(d => {
    d.style.transform = `scale(${1 / markerView.scale})`;
  });
}

function clampMarkerView() {
  const img = document.getElementById('markerImg');
  if (!img) return;
  const maxX = (img.offsetWidth * (markerView.scale - 1)) / 2;
  const maxY = (img.offsetHeight * (markerView.scale - 1)) / 2;
  markerView.tx = Math.max(-maxX, Math.min(maxX, markerView.tx));
  markerView.ty = Math.max(-maxY, Math.min(maxY, markerView.ty));
}

function resetMarkerZoom() {
  markerView = { scale: 1, tx: 0, ty: 0 };
  applyMarkerTransform();
}

function touchDist(t1, t2) {
  return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
}

function handleTouchStart(e) {
  if (e.touches.length === 2) {
    pinchState = { startDist: touchDist(e.touches[0], e.touches[1]), startScale: markerView.scale };
    panState = null;
  } else if (e.touches.length === 1) {
    panState = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx: markerView.tx, ty: markerView.ty };
    didPan = false;
  }
}

function handleTouchMove(e) {
  if (e.touches.length === 2 && pinchState) {
    e.preventDefault();
    const dist = touchDist(e.touches[0], e.touches[1]);
    let scale = pinchState.startScale * (dist / pinchState.startDist);
    markerView.scale = Math.max(1, Math.min(4, scale));
    clampMarkerView();
    applyMarkerTransform();
  } else if (e.touches.length === 1 && panState) {
    const dx = e.touches[0].clientX - panState.x;
    const dy = e.touches[0].clientY - panState.y;
    if (Math.hypot(dx, dy) > 8) didPan = true;
    if (didPan && markerView.scale > 1) {
      e.preventDefault();
      markerView.tx = panState.tx + dx;
      markerView.ty = panState.ty + dy;
      clampMarkerView();
      applyMarkerTransform();
    }
  }
}

function handleTouchEnd(e) {
  if (e.touches.length === 0) {
    pinchState = null;
    panState = null;
  }
}

function handleMarkerTap(e, i) {
  if (didPan) { didPan = false; return; }
  const img = document.getElementById('markerImg');
  const rect = img.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top) / rect.height;
  if (x < 0 || x > 1 || y < 0 || y > 1) return;

  if (!markerData[i]) markerData[i] = [];
  const idx = markerData[i].findIndex(m => Math.hypot(m.x - x, m.y - y) < 0.045);
  if (idx !== -1) {
    markerData[i].splice(idx, 1);
  } else {
    if (markerData[i].length >= 3) { alert('Maximum 3 markers per photo.'); return; }
    markerData[i].push({ x, y });
  }
  renderMarkerDots(i);
}

function renderMarkerDots(i) {
  const stage = document.getElementById('markerStage');
  stage.querySelectorAll('.marker-dot').forEach(d => d.remove());
  (markerData[i] || []).forEach((m, idx) => {
    const dot = document.createElement('div');
    dot.className = 'marker-dot';
    dot.style.left = (m.x * 100) + '%';
    dot.style.top = (m.y * 100) + '%';
    dot.textContent = idx + 1;
    stage.appendChild(dot);
  });
}

function closeMarkerModal(i) {
  document.getElementById('markerModal').remove();
  renderThumbDots(i);
  scheduleDraftSave();
}

function burnMarkersIntoImage(dataURL, markers) {
  return new Promise((resolve) => {
    if (!markers || !markers.length) { resolve(dataURL); return; }
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const radius = Math.max(canvas.width, canvas.height) * 0.02;
      markers.forEach((m, idx) => {
        const cx = m.x * canvas.width;
        const cy = m.y * canvas.height;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.lineWidth = radius * 0.18;
        ctx.strokeStyle = '#000000';
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 0.82, 0, Math.PI * 2);
        ctx.lineWidth = radius * 0.1;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
        ctx.font = `bold ${Math.round(radius)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = radius * 0.18;
        ctx.strokeStyle = '#000000';
        ctx.strokeText(String(idx + 1), cx, cy);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(String(idx + 1), cx, cy);
      });
      resolve(canvas.toDataURL('image/jpeg', 0.92));
    };
    img.onerror = () => resolve(dataURL);
    img.src = dataURL;
  });
}

const NOMINAL_ISO = {
  'Cinestill 800T': 800,
  'Cinestill BWXX': 250,
  'Kodak Gold 200': 200,
  'Kodak Portra 400': 400,
  'Ilford HP5+': 400

function suggestProcessing() {
  const film = document.getElementById('film').value;
  const nominal = NOMINAL_ISO[film];
  const entered = parseFloat(document.getElementById('iso').value);
  const procEl = document.getElementById('processing');
  if (!nominal || !entered || entered <= 0) return;
  const stops = Math.round(Math.log2(entered / nominal));
  const map = { '-2': 'Pull -2', '-1': 'Pull -1', '0': 'Normal', '1': 'Push +1', '2': 'Push +2' };
  const key = String(Math.max(-2, Math.min(2, stops)));
  procEl.value = map[key];
}

function handleLocCheck(checkbox, i) {
  const geoDiv = document.getElementById('geo' + i);
  if (!checkbox.checked) {
    geoDiv.textContent = '';
    geoDiv.className = 'geo';
    if (geoData[i]) {
      delete geoData[i].dateStr;
      delete geoData[i].timeStr;
      if (!geoData[i].lat) delete geoData[i];
    }
    scheduleDraftSave();
    return;
  }
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-GB');
  const timeStr = now.toLocaleTimeString('en-GB', {hour: '2-digit', minute:'2-digit'});
  if (!geoData[i]) geoData[i] = {};
  geoData[i].dateStr = dateStr;
  geoData[i].timeStr = timeStr;
  geoDiv.className = 'geo';
  geoDiv.innerHTML = `${dateStr} ${timeStr}`;
  scheduleDraftSave();
}

function handleGpsCheck(checkbox, i) {
  const gpsDiv = document.getElementById('gps' + i);
  if (!checkbox.checked) {
    gpsDiv.textContent = '';
    gpsDiv.className = 'geo';
    if (geoData[i]) {
      delete geoData[i].lat;
      delete geoData[i].lon;
      if (!geoData[i].dateStr) delete geoData[i];
    }
    scheduleDraftSave();
    return;
  }
  if (!navigator.geolocation) {
    gpsDiv.textContent = 'GPS not available';
    gpsDiv.className = 'geo error';
    checkbox.checked = false;
    return;
  }
  gpsDiv.textContent = 'Locating...';
  gpsDiv.className = 'geo pending';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = pos.coords.latitude.toFixed(6);
      const lon = pos.coords.longitude.toFixed(6);
      if (!geoData[i]) geoData[i] = {};
      geoData[i].lat = lat;
      geoData[i].lon = lon;
      gpsDiv.className = 'geo';
      gpsDiv.innerHTML = `<a href="https://maps.google.com/?q=${lat},${lon}" target="_blank" rel="noopener">${lat}, ${lon}</a>`;
      scheduleDraftSave();
    },
    (err) => {
      let reason = 'GPS failed';
      if (err.code === 1) reason = 'Permission denied';
      else if (err.code === 2) reason = 'Position unavailable';
      else if (err.code === 3) reason = 'Timed out';
      if (!window.isSecureContext) reason = 'Blocked: not https';
      gpsDiv.textContent = reason;
      gpsDiv.className = 'geo error';
      checkbox.checked = false;
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function getProcessingSuggestion(low, med, high, tagged) {
  if (!tagged) return null;
  const pct = v => Math.round((v / tagged) * 100);
  if (high / tagged >= 0.5) {
    return `${pct(high)}% high contrast scenes — consider pull processing (N-1) to hold the highlight range.`;
  }
  if (low / tagged >= 0.5) {
    return `${pct(low)}% low contrast scenes — consider push processing (N+1) to add punch.`;
  }
  return null;
}

function toggleCard(i) {

    const prev = document.getElementById('card' + openCard);
    if (prev) prev.classList.remove('open');
    saveDraft(); // snapshot the moment you leave a frame
  }
  card.classList.toggle('open', !isOpen);
  openCard = isOpen ? null : i;

  if (isOpen) {
    saveDraft(); // snapshot when collapsing the current frame without opening another
  }

  if (!isOpen) {
    const cb = card.querySelector('.loc-row input[type=checkbox]');
    if (cb && !cb.checked) {
      cb.checked = true;
      handleLocCheck(cb, i);
    }
  }

function hasUnsavedData() {
  const cards = document.querySelectorAll('.frame-card');
  if (!cards.length) return false;
  for (const card of cards) {
    if (card.querySelector('.f-desc').value.trim()) return true;
    if (card.querySelector('.f-notes').value.trim()) return true;
    if (card.querySelector('input[type=radio][name^="c"]:checked')) return true;
    if (card.querySelector('input[type=radio][name^="meter"]:checked')) return true;
    const shutterEl = card.querySelector('[data-field="shutter"]');
    if (shutterEl.dataset.touched) return true;
    const apertureEl = card.querySelector('[data-field="aperture"]');
    if (apertureEl.dataset.touched) return true;
  }
  if (Object.keys(photoData).length) return true;
  if (Object.keys(geoData).length) return true;
  return false;
}

  if (hasUnsavedData()) {
    if (!confirm('This will clear the current unsaved roll data. Continue?')) return;

  buildTable();
  clearDraft();
}

function updateSummary(i) {
  const card = document.getElementById('card' + i);
  const desc = card.querySelector('.f-desc').value.trim();
  const shutterEl = card.querySelector('[data-field="shutter"]');
  const apertureEl = card.querySelector('[data-field="aperture"]');
  const shutter = shutterEl.value.trim();
  const aperture = apertureEl.value.trim();
  const touched = !!(shutterEl.dataset.touched || apertureEl.dataset.touched || desc);
  const summaryEl = document.getElementById('summary' + i);

  const parts = [];
  if (desc) parts.push(desc);
  if (touched) {
    const settings = [shutter, aperture].filter(Boolean).join(' ');
    if (settings) parts.push(settings);
  }
  summaryEl.textContent = parts.length ? parts.join(' · ') : 'empty';
  summaryEl.classList.toggle('unedited-tag', !touched);
  scheduleDraftSave();
}

const CRC_TABLE = (() => {
  const table = [];
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    table[n] = c;
  }
  return table;
})();

  let crc = 0 ^ (-1);
  for (let i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ bytes[i]) & 0xFF];
  return (crc ^ (-1)) >>> 0;
}

function u32(n) { return new Uint8Array([n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF]); }

  let total = 0;
  arrays.forEach(a => total += a.length);
  const out = new Uint8Array(total);
  let off = 0;
  arrays.forEach(a => { out.set(a, off); off += a.length; });
  return out;
}

  return { time, d };

    const local = concatBytes([
      u32(0x04034b50), u16(20), u16(0), u16(0), u16(time), u16(d),
      u32(crc), u32(size), u32(size), u16(nameBytes.length), u16(0),
      nameBytes, f.bytes
    ]);
    const localOffset = offset;
    localParts.push(local);
    offset += local.length;
    centralParts.push(concatBytes([
      u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(time), u16(d),
      u32(crc), u32(size), u32(size), u16(nameBytes.length), u16(0), u16(0), u16(0), u16(0),
      u32(0), u32(localOffset), nameBytes
    ]));
  });
  const centralDirStart = offset;
  const centralDir = concatBytes(centralParts);
  const eocd = concatBytes([
    u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
    u32(centralDir.length), u32(centralDirStart), u16(0)
  ]);
  return new Blob([concatBytes([...localParts, centralDir, eocd])], { type: 'application/zip' });
}
function dataURLToBytes(dataURL) {
  const [header, base64] = dataURL.split(',');
  const mimeMatch = header.match(/data:(.*?);base64/);
  const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  let ext = 'jpg';
  if (mime.includes('png')) ext = 'png';
  else if (mime.includes('webp')) ext = 'webp';
  else if (mime.includes('heic')) ext = 'heic';
  return { bytes, ext };
}
function sanitizeName(s) {
  return (s || 'roll').toString().trim().replace(/[^a-z0-9_-]+/gi, '_') || 'roll';
}

// ---- File-based draft backup (reliable, independent of browser storage) ----
function saveDraftToFile() {
  const cards = document.querySelectorAll('.frame-card');
  if (!cards.length) { alert('Build the table first.'); return; }
  const data = collectRollData();
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `exposure_autosave_draft.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function loadDraftFromFile(input) {
  const file = input.files[0];
  if (!file) return;
  if (hasUnsavedData()) {
    if (!confirm('Loading a draft will replace your current unsaved data. Continue?')) { input.value = ''; return; }
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      hydrateForm(data);
    } catch (err) {
      alert('Could not read this draft file.');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

// ---- Archive (saved in browser storage) ----
function collectRollData() {
  const cards = document.querySelectorAll('.frame-card');
  const frameData = [];
  cards.forEach((card, idx) => {
    const num = idx + 1;
    const meterChecked = card.querySelector('input[type=radio][name^="meter"]:checked');
    const sekChecked = card.querySelector('input[type=radio][name^="sekmode"]:checked');
    const contrastChecked = card.querySelector('input[type=radio][name^="c"]:checked');
    frameData.push({
      desc: card.querySelector('.f-desc').value,
      notes: card.querySelector('.f-notes').value,
      contrast: contrastChecked ? contrastChecked.value : '',
      shutter: card.querySelector('[data-field="shutter"]').value,
      aperture: card.querySelector('[data-field="aperture"]').value,
      meter: meterChecked ? meterChecked.value : '',
      sekmode: sekChecked ? sekChecked.value : '',
      timestamp: geoData[num] || null,
      photo: photoData[num] || null,
      markers: markerData[num] || []
    });
  });
  return {
    id: Date.now().toString(),
    savedAt: new Date().toISOString(),
    film: document.getElementById('film').value,
    filmOther: document.getElementById('filmOther').value,
    format: document.getElementById('format').value,
    iso: document.getElementById('iso').value,
    processing: document.getElementById('processing').value,
    roll: document.getElementById('roll').value,
    frames: document.getElementById('frames').value,
    frameData
  };
}
function loadArchive() {
  try { return JSON.parse(localStorage.getItem('exposureArchive') || '[]'); }
  catch (e) { return []; }
}
function saveToArchive() {
  const data = collectRollData();
  const archive = loadArchive();
  archive.unshift(data);
  try {
    localStorage.setItem('exposureArchive', JSON.stringify(archive));
  } catch (e) {
    alert('The ZIP downloaded fine, but the archive could not save (browser storage full or unavailable).');
    return;
  }
  renderArchive();
}
function renderArchive() {
  const archive = loadArchive();
  const container = document.getElementById('archiveList');
  if (!archive.length) {
    container.innerHTML = '<div id="empty">No saved rolls yet.</div>';
    return;
  }
  container.innerHTML = archive.map(entry => {
    const filmLabel = entry.film === 'Other' ? (entry.filmOther || 'Other') : entry.film;
    const dateLabel = new Date(entry.savedAt).toLocaleDateString('en-GB');
    const procLabel = entry.processing && entry.processing !== 'Normal' ? ` · ${entry.processing}` : '';
    const formatLabel = entry.format || '35mm';
    return `
      <div class="archive-item">
        <div class="archive-info">
          <div class="archive-title">${filmLabel} · ${formatLabel} · Roll ${entry.roll || '-'}</div>
          <div class="archive-sub">${entry.frames} frames · ${dateLabel}${procLabel}</div>
        </div>
        <div class="archive-actions">
          <button type="button" onclick="openArchiveEntry('${entry.id}')">Open</button>
          <button type="button" class="danger" onclick="deleteArchiveEntry('${entry.id}')">Delete</button>
        </div>
      </div>`;
  }).join('');
}
function hydrateForm(entry) {
  document.getElementById('film').value = entry.film;
  toggleOtherFilm();
  if (entry.film === 'Other') document.getElementById('filmOther').value = entry.filmOther || '';
  document.getElementById('format').value = entry.format || '35mm';
  document.getElementById('iso').value = entry.iso;
  document.getElementById('processing').value = entry.processing || 'Normal';
  document.getElementById('roll').value = entry.roll;
  document.getElementById('frames').value = entry.frames;
  buildTable();
  clearDraft();

  entry.frameData.forEach((fd, idx) => {
    const num = idx + 1;
    const card = document.getElementById('card' + num);
    if (!card) return;
    card.querySelector('.f-desc').value = fd.desc || '';
    card.querySelector('.f-notes').value = fd.notes || '';
    if (fd.contrast) {
      const cb = card.querySelector(`input[type=radio][name="c${num}"][value="${fd.contrast}"]`);
      if (cb) cb.checked = true;
    }
    const shutterEl = card.querySelector('[data-field="shutter"]');
    shutterEl.value = fd.shutter || '';
    shutterEl.dataset.touched = '1';
    const apertureEl = card.querySelector('[data-field="aperture"]');
    apertureEl.value = fd.aperture || '';
    apertureEl.dataset.touched = '1';
    if (fd.meter) {
      const meterEl = card.querySelector(`input[type=radio][name="meter${num}"][value="${fd.meter}"]`);
      if (meterEl) { meterEl.checked = true; toggleSekonicSub(num, fd.meter === 'Sekonic'); }
    }
    if (fd.sekmode) {
      const sekEl = card.querySelector(`input[type=radio][name="sekmode${num}"][value="${fd.sekmode}"]`);
      if (sekEl) sekEl.checked = true;
    }
    if (fd.timestamp) {
      geoData[num] = fd.timestamp;
      const locChecks = card.querySelectorAll('.loc-row input[type=checkbox]');
      if (fd.timestamp.dateStr) {
        locChecks[0].checked = true;
        document.getElementById('geo' + num).innerHTML = `${fd.timestamp.dateStr} ${fd.timestamp.timeStr}`;
      }
      if (fd.timestamp.lat) {
        locChecks[1].checked = true;
        document.getElementById('gps' + num).innerHTML = `<a href="https://maps.google.com/?q=${fd.timestamp.lat},${fd.timestamp.lon}" target="_blank" rel="noopener">${fd.timestamp.lat}, ${fd.timestamp.lon}</a>`;
      }
    }
    if (fd.photo) {
      photoData[num] = fd.photo;
      markerData[num] = fd.markers || [];
      const img = document.getElementById('photoPreview' + num);
      img.src = fd.photo;
      document.getElementById('photoWrap' + num).style.display = 'flex';
      renderThumbDots(num);
    }
    updateSummary(num);
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function openArchiveEntry(id) {
  if (hasUnsavedData()) {
    if (!confirm('Opening this saved roll will replace your current unsaved data. Continue?')) return;
  }
  const entry = loadArchive().find(e => e.id === id);
  if (!entry) return;
  hydrateForm(entry);
}
function deleteArchiveEntry(id) {
  if (!confirm('Delete this saved roll? This cannot be undone.')) return;
  const archive = loadArchive().filter(e => e.id !== id);
  localStorage.setItem('exposureArchive', JSON.stringify(archive));
  renderArchive();
}

async function exportRoll() {
  const cards = document.querySelectorAll('.frame-card');
  if (!cards.length) { alert('Build the table first.'); return; }

  const roll = document.getElementById('roll').value || 'untitled';
  const format = document.getElementById('format').value || '';
  const files = [{ name: 'notes.txt', bytes: new TextEncoder().encode(buildLogText()) }];
  for (let idx = 0; idx < cards.length; idx++) {
    const num = idx + 1;
    const photo = photoData[num];
    if (photo) {
      const finalDataURL = await burnMarkersIntoImage(photo, markerData[num]);
      const { bytes, ext } = dataURLToBytes(finalDataURL);
      files.push({ name: `frame_${String(num).padStart(2, '0')}.${ext}`, bytes });
    }
  }
  const zipBlob = buildZip(files);
  const url = URL.createObjectURL(zipBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ExposureLog_${sanitizeName(format)}_Roll${sanitizeName(roll)}.zip`;
  a.click();
  URL.revokeObjectURL(url);

  saveToArchive();
  clearDraft();
  bumpRollNumber();
  showContrastSummary();
}

function bumpRollNumber() {
  const rollEl = document.getElementById('roll');
  const match = rollEl.value.match(/^(\D*)(\d+)(\D*)$/);
  if (match) {
    rollEl.value = match[1] + (parseInt(match[2], 10) + 1) + match[3];
  }
}

function handleFormatChange() {
  const cards = document.querySelectorAll('.frame-card');
  if (!cards.length) {
    document.getElementById('roll').value = nextRollNumberFromArchive();
  }
}

function nextRollNumberFromArchive() {
  const format = document.getElementById('format').value;
  const archive = loadArchive().filter(e => (e.format || '35mm') === format);
  let max = 0;
  archive.forEach(entry => {
    const n = parseInt(entry.roll, 10);
    if (!isNaN(n) && n > max) max = n;
  });
  return max ? String(max + 1) : '1';
}

// ---- Autosave draft (protects against data loss before export) ----
let draftTimer = null;
function scheduleDraftSave() {
  clearTimeout(draftTimer);
  draftTimer = setTimeout(saveDraft, 800);
}
function saveDraft() {
  if (!hasUnsavedData()) { clearDraft(); return; }
  try {
    localStorage.setItem('exposureDraft', JSON.stringify(collectRollData()));
  } catch (e) { /* storage unavailable, ignore silently */ }
}
function clearDraft() {
  try { localStorage.removeItem('exposureDraft'); } catch (e) {}
}
function loadDraftIfAny() {
  let draft = null;
  try { draft = JSON.parse(localStorage.getItem('exposureDraft') || 'null'); } catch (e) { draft = null; }
  if (!draft || !draft.frameData || !draft.frameData.length) return;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'draftModal';
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-title">Unsaved roll found</div>
      <div style="font-size:13px; line-height:1.5; color:var(--ink); margin-bottom:4px;">
        Looks like a roll (${draft.frames} frames) wasn't exported last time. Restore it?
      </div>
      <button type="button" class="modal-close" onclick="restoreDraft()">Restore</button>
      <button type="button" class="modal-close" style="background:transparent; color:var(--ink); border:1.5px solid var(--line); margin-top:8px;" onclick="clearDraft(); document.getElementById('draftModal').remove();">Discard</button>
    </div>`;
  document.body.appendChild(overlay);
}
function restoreDraft() {
  let draft = null;
  try { draft = JSON.parse(localStorage.getItem('exposureDraft') || 'null'); } catch (e) { draft = null; }
  document.getElementById('draftModal').remove();
  if (!draft) return;
  hydrateForm(draft);
}

// ---- Storage persistence check ----
function checkStorageStatus() {
  const el = document.getElementById('storageStatus');
  let works = false;
  try {
    localStorage.setItem('exposureStorageTest', '1');
    works = localStorage.getItem('exposureStorageTest') === '1';
  } catch (e) { works = false; }

  if (!works) {
    el.textContent = 'browser storage unavailable — use Save Draft above';
    return;
  }
  let firstSeen = null;
  try { firstSeen = localStorage.getItem('exposureFirstSeen'); } catch (e) {}
  if (firstSeen) {
    el.textContent = `storage persisted since ${new Date(firstSeen).toLocaleDateString('en-GB')}`;
  } else {
    try { localStorage.setItem('exposureFirstSeen', new Date().toISOString()); } catch (e) {}
    el.textContent = 'unverified — use Save Draft as backup too';
  }
}

document.getElementById('tableWrap').addEventListener('input', scheduleDraftSave);
document.getElementById('tableWrap').addEventListener('change', scheduleDraftSave);

renderArchive();
checkStorageStatus();
if (!document.getElementById('roll').value) {
  document.getElementById('roll').value = nextRollNumberFromArchive();
}
loadDraftIfAny();
</script>

</body>
</html>
